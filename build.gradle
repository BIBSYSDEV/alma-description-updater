plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
    id 'nebula.lint' version '20.6.2'
}

group 'no.unit.alma'
version '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

wrapper {
    distributionType = Wrapper.DistributionType.ALL
    gradleVersion = "8.14.7"
}

dependencies {
    implementation "com.google.code.gson:gson:2.15.0"
    implementation "com.amazonaws:aws-lambda-java-events:3.16.1"
    implementation "software.amazon.awssdk:sqs:2.57.13"
    implementation "com.amazonaws:aws-lambda-java-core:1.4.1"
    implementation "com.github.BIBSYSDEV:marc21-xml-parser:2.11.5"
    implementation "com.github.bibsysdev:core:2.11.2"
    implementation "software.amazon.awssdk:aws-core:2.57.13"
    implementation "software.amazon.awssdk:regions:2.57.13"

    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.23.0"
    testImplementation "org.mockito:mockito-core:5.24.0"
    testImplementation "org.hamcrest:hamcrest:3.0"
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter:6.1.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"

    implementation "org.slf4j:slf4j-api:2.0.20"
    runtimeOnly "com.amazonaws:aws-lambda-java-log4j2:1.6.5"
    runtimeOnly "org.apache.logging.log4j:log4j-core:2.26.1"
    runtimeOnly "org.apache.logging.log4j:log4j-api:2.26.1"
    runtimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1"

    pmdAux javaToolchains.launcherFor(java.toolchain)
            .map { it.metadata.installationPath }
            .map { it.files("lib/jrt-fs.jar") }
}

gradleLint {
    rules = ['all-dependency']
    reportFormat = 'html'
    reportOnlyFixableViolations = true
}

tasks.named('test', Test) {
    useJUnitPlatform()
    failFast = true
    finalizedBy jacocoTestReport
    testLogging {
        events 'skipped', 'failed'
    }
}

pmd {
    toolVersion = '7.28.0'
    ruleSetConfig = rootProject.resources.text.fromFile('config/pmd/ruleset.xml')
    ruleSets = []
    ignoreFailures = false
}

checkstyle {
    toolVersion = '14.4.0'
    configFile = rootProject.resources.text.fromFile('config/checkstyle/checkstyle.xml').asFile()
    showViolations = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required
        html.stylesheet = rootProject.resources.text.fromFile('config/checkstyle/checkstyle-simple.xsl')
    }
}

jacoco {
    toolVersion = "0.8.16"
}

jacocoTestReport {
    reports {
        html.outputLocation.set(layout.buildDirectory.dir("reports/jacoco"))
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.named('jacocoTestCoverageVerification').configure {
    dependsOn tasks.named('jacocoTestReport')

    violationRules {
        rule {
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }

        rule {
            limit {
                counter = 'CLASS'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}
